name: Publish Ashish DJ Music website files
on:
  push:
    branches: [main]
    paths:
      - site-bundle.tar.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract website bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode site-bundle.tar.gz.b64 > /tmp/ashish-dj-site.tar.gz
          mkdir -p /tmp/ashish-dj-site
          tar -xzf /tmp/ashish-dj-site.tar.gz -C /tmp/ashish-dj-site
          cp -a /tmp/ashish-dj-site/ashish-dj-business-site/. .
          rm -f site-bundle.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Ashish DJ Music website source"
          git push

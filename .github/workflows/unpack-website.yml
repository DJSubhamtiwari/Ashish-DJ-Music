name: Unpack Ashish DJ Music website
on:
  push:
    branches: [main]
    paths:
      - site-bundle.zip.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Upload website source bundle')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract website files into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f site-bundle.zip.b64
          base64 --decode site-bundle.zip.b64 > /tmp/ashish-dj-music-site.zip
          mkdir -p /tmp/ashish-dj-music-site
          unzip -q /tmp/ashish-dj-music-site.zip -d /tmp/ashish-dj-music-site
          cp -a /tmp/ashish-dj-music-site/ashish-dj-business-site/. .
          rm -f site-bundle.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Ashish DJ Music website source"
          git push
